<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dear Future Me — a private letter box</title>
<style>
  :root{
    --paper: #EDE3D0;
    --paper-card: #F7F1E3;
    --paper-card-2: #F1E8D6;
    --ink: #2B2A28;
    --ink-soft: #5B5347;
    --indigo: #2E3B55;
    --indigo-soft: #445071;
    --wax: #9C3D34;
    --wax-dark: #7E312A;
    --brass: #A8853B;
    --sage: #6B7A5E;
    --line: rgba(43,42,40,0.14);
    --shadow: rgba(43,32,20,0.18);
    --focus: #2E3B55;
    --radius: 3px;
    --serif: "Iowan Old Style","Palatino Linotype","URW Palladio","Book Antiqua", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"]{
    --paper: #1E1B16;
    --paper-card: #2A2620;
    --paper-card-2: #26221D;
    --ink: #EDE3D0;
    --ink-soft: #B9AE99;
    --indigo: #7C8CB3;
    --indigo-soft: #A5B0CE;
    --wax: #C1584C;
    --wax-dark: #A0453A;
    --brass: #C9A85C;
    --sage: #8FA37D;
    --line: rgba(237,227,208,0.14);
    --shadow: rgba(0,0,0,0.4);
    --focus: #C9A85C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:.05; mix-blend-mode:multiply;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }
  [data-theme="dark"] body::before{ opacity:.07; mix-blend-mode:overlay; }
  #app{ position:relative; z-index:1; }
  ::selection{ background: var(--brass); color:#fff; }
  a{color:inherit;}
  button{font-family:var(--sans);}
  :focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }
  button, [role="tab"], input, textarea, select{
    font-size:1rem;
  }

  /* ---------- layout shell ---------- */
  #app{
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--paper-card-2);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:28px 0 20px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:0 24px 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:14px;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-seal{
    width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, var(--wax) 0%, var(--wax-dark) 70%);
    box-shadow: inset 0 -2px 4px rgba(0,0,0,.35), 0 1px 2px var(--shadow);
    flex-shrink:0;
    position:relative;
  }
  .brand-seal::after{
    content:"";
    position:absolute; inset:7px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:50%;
  }
  .brand-title{
    font-family:var(--serif);
    font-size:1.05rem;
    font-weight:700;
    line-height:1.15;
  }
  .brand-sub{
    font-size:.72rem;
    color:var(--ink-soft);
    margin-top:2px;
    letter-spacing:.02em;
  }
  nav.tabs{
    display:flex;
    flex-direction:column;
    gap:2px;
    padding:14px 12px;
    flex:1;
  }
  nav.tabs button{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    background:none;
    border:none;
    color:var(--ink);
    padding:10px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:.92rem;
    position:relative;
  }
  nav.tabs button:hover{ background:rgba(43,42,40,0.06); }
  [data-theme="dark"] nav.tabs button:hover{ background:rgba(237,227,208,0.06); }
  nav.tabs button.active{
    background:var(--paper-card);
    box-shadow: inset 3px 0 0 var(--wax);
    font-weight:600;
  }
  nav.tabs button .ico{ width:18px; height:18px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; opacity:.75; }
  nav.tabs button .ico svg{ width:16px; height:16px; }
  nav.tabs button.active .ico{ opacity:1; color:var(--wax); }
  nav.tabs button .count{
    margin-left:auto;
    font-size:.7rem;
    background:var(--wax);
    color:#fff;
    padding:1px 7px;
    border-radius:10px;
    font-weight:600;
  }
  .sidebar-foot{
    padding:14px 24px 0;
    border-top:1px solid var(--line);
    margin-top:8px;
  }
  .theme-toggle{
    display:flex; align-items:center; gap:8px;
    background:none; border:1px solid var(--line); color:var(--ink);
    padding:7px 10px; border-radius:var(--radius); cursor:pointer; font-size:.78rem;
    width:100%;
    justify-content:center;
  }
  .privacy-note{
    font-size:.68rem;
    color:var(--ink-soft);
    margin-top:10px;
    line-height:1.5;
  }

  main{
    flex:1;
    padding:40px 48px 80px;
    max-width:860px;
  }
  .mobile-tabs{ display:none; }

  h1.page-title{
    font-family:var(--serif);
    font-size:1.9rem;
    margin:0 0 14px;
    position:relative;
    padding-bottom:16px;
  }
  h1.page-title::after{
    content:"";
    position:absolute; left:0; bottom:0;
    width:46px; height:3px;
    background:linear-gradient(90deg, var(--brass), transparent);
    border-radius:2px;
  }
  .page-kicker{
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:var(--wax);
    font-weight:700;
    margin-bottom:8px;
  }
  .page-sub{
    color:var(--ink-soft);
    margin:0 0 28px;
    max-width:56ch;
    line-height:1.6;
  }

  /* ---------- banners ---------- */
  .banner{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--indigo);
    color:#F3F0E8;
    padding:14px 18px;
    border-radius:var(--radius);
    margin-bottom:22px;
    cursor:pointer;
    border:none;
    width:100%;
    text-align:left;
    font-size:.9rem;
  }
  .banner strong{ font-weight:700; }
  .banner .arrow{ margin-left:auto; opacity:.8; }

  /* ---------- cards ---------- */
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 2px var(--shadow);
  }
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:14px;
    margin-bottom:30px;
  }
  .stat{
    padding:18px 18px 16px;
  }
  .stat .num{
    font-family:var(--serif);
    font-size:1.9rem;
    line-height:1;
  }
  .stat .label{
    margin-top:6px;
    font-size:.76rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.06em;
  }

  .home-cta{
    padding:26px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:24px;
  }
  .home-cta p{ margin:4px 0 0; color:var(--ink-soft); max-width:42ch; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    border-radius:var(--radius);
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    font-weight:600;
    font-size:.88rem;
    white-space:nowrap;
  }
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn.danger{
    background:transparent;
    color:var(--wax);
    border:1px solid var(--wax);
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---------- write form ---------- */
  .field{ margin-bottom:20px; }
  .field label{
    display:block;
    font-size:.8rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-card);
    color:var(--ink);
    font-family:var(--serif);
    font-size:1rem;
  }
  .field textarea{
    font-family:var(--serif);
    font-size:1.08rem;
    line-height:1.7;
    min-height:260px;
    resize:vertical;
  }
  .field .hint{ font-size:.76rem; color:var(--ink-soft); margin-top:6px; }

  .mood-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .mood-btn{
    border:1px solid var(--line);
    background:var(--paper-card);
    border-radius:20px;
    padding:7px 13px;
    cursor:pointer;
    font-size:.95rem;
  }
  .mood-btn.selected{ background:var(--indigo); color:#fff; border-color:var(--indigo); }

  .delivery-options{ display:flex; flex-direction:column; gap:10px; }
  .delivery-choice{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
  }
  .delivery-choice.selected{ border-color:var(--wax); background:rgba(156,61,52,0.06); }
  .delivery-choice input{ margin-top:3px; }
  .delivery-choice .title{ font-weight:600; font-size:.92rem; }
  .delivery-choice .sub{ font-size:.78rem; color:var(--ink-soft); margin-top:2px; }
  .presets{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .preset-btn{
    border:1px solid var(--line);
    background:var(--paper-card-2);
    border-radius:14px;
    padding:6px 13px;
    font-size:.8rem;
    cursor:pointer;
  }
  .preset-btn:hover{ border-color:var(--brass); }
  .preset-btn.selected{ background:var(--brass); color:#fff; border-color:var(--brass); }
  .preset-btn.birthday-btn{ background:var(--indigo); color:#fff; border-color:var(--indigo); }

  .stepper-block{
    background:var(--paper-card-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px 18px 18px;
    margin-top:14px;
  }
  .stepper-block-label{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--ink-soft); font-weight:700; margin-bottom:12px;
  }
  .stepper-row{ display:flex; gap:22px; flex-wrap:wrap; }
  .stepper{ text-align:center; }
  .stepper .stepper-unit{ font-size:.74rem; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
  .stepper-control{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:20px; overflow:hidden; background:var(--paper-card); }
  .stepper-btn{
    width:32px; height:32px; border:none; background:none; color:var(--ink);
    font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .stepper-btn:hover{ background:var(--wax); color:#fff; }
  .stepper-val{ min-width:34px; text-align:center; font-family:var(--serif); font-size:1.05rem; font-weight:700; }
  .stepper-summary{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    font-size:.9rem; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .stepper-summary .arrives{ font-weight:700; font-family:var(--serif); }
  .stepper-summary .reset-link{
    margin-left:auto; background:none; border:none; color:var(--wax); font-size:.78rem;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .birthday-active-note{
    display:flex; align-items:center; gap:10px; margin-top:12px;
    font-size:.85rem; color:var(--ink-soft);
  }
  .birthday-active-note button{
    background:none; border:none; color:var(--wax); text-decoration:underline; cursor:pointer; font-size:.8rem; padding:0;
  }
  .tag-input-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip{
    background:var(--sage);
    color:#fff;
    padding:4px 10px 4px 12px;
    border-radius:14px;
    font-size:.78rem;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip button{
    background:none;border:none;color:#fff;cursor:pointer;font-size:.9rem;line-height:1;
    opacity:.8;
  }

  /* ---------- letter list items ---------- */
  .letter-list{ display:flex; flex-direction:column; gap:12px; }
  .letter-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 18px;
    cursor:pointer;
  }
  .letter-row:hover{ box-shadow:0 2px 6px var(--shadow); }
  .seal-mini{
    width:38px;height:38px;border-radius:50%;
    flex-shrink:0;
    background:radial-gradient(circle at 32% 30%, var(--wax) 0%, var(--wax-dark) 75%);
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.75);
    font-size:.7rem;
  }
  .seal-mini.open{
    background:var(--paper-card-2);
    box-shadow:inset 0 0 0 1px var(--line);
    color:var(--ink-soft);
  }
  .letter-row .meta{ flex:1; min-width:0; }
  .letter-row .title{
    font-family:var(--serif);
    font-size:1.05rem;
    font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .letter-row .sub{ font-size:.78rem; color:var(--ink-soft); margin-top:3px; }
  .letter-row .badge{
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:3px 8px;
    border-radius:10px;
    background:var(--indigo);
    color:#fff;
    flex-shrink:0;
  }
  .letter-row .badge.new{ background:var(--wax); }
  .letter-row .badge.muted{ background:var(--paper-card-2); color:var(--ink-soft); box-shadow:inset 0 0 0 1px var(--line); }

  .empty-state{
    padding:50px 30px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-state .glyph{ font-size:2rem; margin-bottom:10px; opacity:.6; }
  .empty-state h3{ font-family:var(--serif); color:var(--ink); margin:0 0 6px; }
  .empty-state p{ max-width:40ch; margin:0 auto 16px; line-height:1.5; font-size:.9rem; }

  /* ---------- filters / search ---------- */
  .toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text], .toolbar select{
    padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--paper-card); color:var(--ink); font-family:var(--sans); font-size:.85rem;
  }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,16,10,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  .modal{
    background:var(--paper-card);
    max-width:620px; width:100%;
    max-height:88vh; overflow-y:auto;
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    position:relative;
  }
  .modal-close{
    position:sticky; top:0; float:right; margin:14px 14px 0 0;
    background:var(--paper-card-2); border:1px solid var(--line); border-radius:50%;
    width:32px;height:32px; cursor:pointer; font-size:1rem; color:var(--ink);
    z-index:2;
  }
  .modal-inner{ padding:36px 40px 40px; }
  .letter-envelope{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:50px 20px;
  }
  .seal-big{
    width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, var(--wax) 0%, var(--wax-dark) 75%);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.4), 0 3px 10px rgba(0,0,0,.25);
    margin-bottom:22px;
    position:relative;
  }
  .seal-big::after{
    content:"✒"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.8); font-size:1.6rem;
  }
  .seal-big.cracking{ animation: crack .5s ease forwards; }
  @keyframes crack{
    0%{ transform:scale(1) rotate(0); }
    40%{ transform:scale(1.08) rotate(-3deg); }
    100%{ transform:scale(0) rotate(12deg); opacity:0; }
  }
  .letter-doc{
    font-family:var(--serif);
    line-height:1.8;
    font-size:1.08rem;
    white-space:pre-wrap;
    animation: fadeUp .5s ease;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .letter-doc-head{
    margin-bottom:22px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .letter-doc-title{ font-size:1.5rem; font-weight:700; margin:0 0 6px; }
  .letter-doc-dates{ font-size:.8rem; color:var(--ink-soft); font-family:var(--sans); }
  .letter-doc-tags{ margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .letter-doc-tags .chip{ background:var(--paper-card-2); color:var(--ink-soft); box-shadow:inset 0 0 0 1px var(--line); }
  .modal-actions{ display:flex; gap:10px; margin-top:28px; padding-top:20px; border-top:1px solid var(--line); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:860px){
    #app{ flex-direction:column; }
    .sidebar{ display:none; }
    main{ padding:24px 18px 90px; max-width:none; }
    .mobile-tabs{
      display:flex;
      position:sticky; top:0; z-index:20;
      background:var(--paper-card-2);
      border-bottom:1px solid var(--line);
      overflow-x:auto;
      padding:10px 10px;
      gap:6px;
    }
    .mobile-tabs button{
      flex-shrink:0;
      border:1px solid var(--line);
      background:var(--paper-card);
      color:var(--ink);
      padding:8px 13px;
      border-radius:14px;
      font-size:.8rem;
      cursor:pointer;
    }
    .mobile-tabs button.active{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
    .home-cta{ flex-direction:column; align-items:flex-start; }
    .modal-inner{ padding:26px 20px 30px; }
  }

  /* ---------- onboarding ---------- */
  .onboard-overlay{
    position:fixed; inset:0; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:24px;
  }
  .onboard-card{
    max-width:560px; width:100%;
    background:var(--paper-card);
    border-radius:8px;
    padding:44px 40px;
    box-shadow:0 20px 60px var(--shadow);
  }
  .onboard-seal{
    width:60px;height:60px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, var(--wax) 0%, var(--wax-dark) 75%);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.35);
    margin-bottom:20px;
  }
  .onboard-card h1{ font-family:var(--serif); font-size:1.7rem; margin:0 0 12px; }
  .onboard-card p{ color:var(--ink-soft); line-height:1.6; margin:0 0 14px; }
  .onboard-list{ margin:18px 0 26px; padding:0; list-style:none; }
  .onboard-list li{ display:flex; gap:10px; margin-bottom:10px; font-size:.92rem; line-height:1.5; }
  .onboard-list li .b{ color:var(--sage); flex-shrink:0; }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
"use strict";

/* =========================================================
   STORAGE
========================================================= */
const STORE_KEY = "dearFutureMe.v1";

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){
    console.error("Could not read local storage", e);
    return null;
  }
}
function saveData(data){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  }catch(e){
    alert("Your browser blocked saving to local storage. Your last change may not be kept. (" + e.message + ")");
  }
}
function freshData(){
  return {
    settings:{ name:"", birthday:"", theme:"light", onboarded:false, lastSeen: todayStr() },
    entries:[]
  };
}

let DATA = loadData() || freshData();
if(!DATA.settings) DATA.settings = freshData().settings;
if(!DATA.entries) DATA.entries = [];

/* =========================================================
   DATE HELPERS  (date-only strings: YYYY-MM-DD, compared lexicographically)
========================================================= */
function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function dateStrOf(dateObjOrIso){
  const d = new Date(dateObjOrIso);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function monthDay(dateStr){ return dateStr.slice(5); } // "MM-DD"
function yearOf(dateStr){ return parseInt(dateStr.slice(0,4),10); }
function addToDate(baseStr, amount, unit){
  const [y,m,d] = baseStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  if(unit === "days") dt.setDate(dt.getDate()+amount);
  if(unit === "months") dt.setMonth(dt.getMonth()+amount);
  if(unit === "years") dt.setFullYear(dt.getFullYear()+amount);
  return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
}
function daysBetween(fromStr, toStr){
  const [fy,fm,fd] = fromStr.split("-").map(Number);
  const [ty,tm,td] = toStr.split("-").map(Number);
  const a = new Date(fy,fm-1,fd), b = new Date(ty,tm-1,td);
  return Math.round((b-a) / 86400000);
}
function formatDate(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { year:"numeric", month:"long", day:"numeric" });
}
function formatDateShort(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
}
function nextBirthday(birthdayMMDD){
  if(!birthdayMMDD) return null;
  const t = todayStr();
  const y = yearOf(t);
  let candidate = y + "-" + birthdayMMDD;
  if(candidate <= t) candidate = (y+1) + "-" + birthdayMMDD;
  return candidate;
}
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
}

/* =========================================================
   DERIVED ENTRY STATE
========================================================= */
// entry: {id, title, body, mood, tags[], createdAt(iso), createdDateStr, deliveryDate(YYYY-MM-DD or null), opened(bool), openedAt}
function isSealed(entry){
  return !!entry.deliveryDate && entry.deliveryDate > todayStr();
}
function isJustArrived(entry){
  return !!entry.deliveryDate && entry.deliveryDate <= todayStr() && !entry.opened;
}
function isImmediateUnread(entry){
  return !entry.deliveryDate && !entry.opened;
}

function anniversariesForToday(){
  const t = todayStr();
  const md = monthDay(t);
  const curY = yearOf(t);
  return DATA.entries
    .filter(e => !isSealed(e))
    .filter(e => monthDay(e.createdDateStr) === md && yearOf(e.createdDateStr) < curY)
    .map(e => Object.assign({}, e, { yearsAgo: curY - yearOf(e.createdDateStr) }))
    .sort((a,b)=> a.yearsAgo - b.yearsAgo);
}

function sealedEntries(){
  return DATA.entries.filter(isSealed).sort((a,b)=> a.deliveryDate.localeCompare(b.deliveryDate));
}
function inboxEntries(){
  return DATA.entries.filter(e => !isSealed(e))
    .filter(e => isJustArrived(e) || isImmediateUnread(e) || (!e.deliveryDate ? false : true) === true ? true : true) // all delivered ones live here permanently too
    .sort((a,b)=> {
      const da = e_deliveredDate(a), db = e_deliveredDate(b);
      return db.localeCompare(da);
    });
}
function e_deliveredDate(e){ return e.deliveryDate || e.createdDateStr; }
function unreadCount(){
  return DATA.entries.filter(e => !isSealed(e) && !e.opened).length;
}

function newDraft(){
  return { title:"", body:"", mood:"", tags:[], deliveryMode:"open",
           years:0, months:0, days:0, specialDate:null, specialLabel:"" };
}
let writeDraft = newDraft();

function computeDeliveryDate(draft){
  if(draft.specialDate) return draft.specialDate;
  let d = todayStr();
  d = addToDate(d, draft.years||0, "years");
  d = addToDate(d, draft.months||0, "months");
  d = addToDate(d, draft.days||0, "days");
  return d;
}
function draftHasOffset(draft){
  return !!draft.specialDate || (draft.years||0)>0 || (draft.months||0)>0 || (draft.days||0)>0;
}
function humanizeOffset(draft){
  if(draft.specialDate) return draft.specialLabel || ("on " + formatDate(draft.specialDate));
  const parts = [];
  if(draft.years) parts.push(draft.years + " year" + (draft.years>1?"s":""));
  if(draft.months) parts.push(draft.months + " month" + (draft.months>1?"s":""));
  if(draft.days) parts.push(draft.days + " day" + (draft.days>1?"s":""));
  return parts.length ? parts.join(", ") : "0 days";
}

        resetBtn.className = "reset-link"; resetBtn.textContent = "Reset";
        resetBtn.addEventListener("click", ()=>{ writeDraft.years=0; writeDraft.months=0; writeDraft.days=0; rerenderWrite(); });
        summary.appendChild(resetBtn);
      }
      stepBlock.appendChild(summary);
      presetWrap.appendChild(stepBlock);
    }
    delWrap.appendChild(presetWrap);
  }
  fDelivery.appendChild(delWrap);
  form.appendChild(fDelivery);

  const actions = el("div");
  actions.style.display="flex"; actions.style.gap="10px"; actions.style.marginTop="26px";
  const saveBtn = document.createElement("button");
  saveBtn.className="btn"; saveBtn.textContent = writeDraft.deliveryMode==="seal" ? "Seal this letter" : "Save letter";
  saveBtn.disabled = !writeDraft.body.trim() || (writeDraft.deliveryMode==="seal" && !draftHasOffset(writeDraft));
  saveBtn.addEventListener("click", saveLetterFromDraft);
  actions.appendChild(saveBtn);
  const clearBtn = document.createElement("button");
  clearBtn.className="btn secondary"; clearBtn.textContent = "Clear";
  clearBtn.addEventListener("click", ()=>{ writeDraft = newDraft(); rerenderWrite(); });
  actions.appendChild(clearBtn);
  form.appendChild(actions);

  frag.appendChild(form);
  return frag;

  function deliveryChoiceRow(mode, title, sub){
    const row = el("label","delivery-choice" + (writeDraft.deliveryMode===mode ? " selected":""));
    const radio = document.createElement("input");
    radio.type="radio"; radio.name="delivery"; radio.checked = writeDraft.deliveryMode===mode;
    radio.addEventListener("change", ()=>{ writeDraft.deliveryMode = mode; rerenderWrite(); });
    row.appendChild(radio);
    const txt = el("span");
    txt.innerHTML = `<div class="title">${title}</div><div class="sub">${sub}</div>`;
    row.appendChild(txt);
    return row;
  }
}
function rerenderWrite(){ if(ROUTE==="write") render(); }

function saveLetterFromDraft(){
  if(!writeDraft.body.trim()) return;
  const now = new Date();
  const entry = {
    id: uid(),
    title: writeDraft.title.trim() || "Untitled letter",
    body: writeDraft.body,
    mood: writeDraft.mood,
    tags: writeDraft.tags.slice(),
    createdAt: now.toISOString(),
    createdDateStr: todayStr(),
    deliveryDate: writeDraft.deliveryMode==="seal" ? computeDeliveryDate(writeDraft) : null,
    opened: false,
    openedAt: null
  };
  DATA.entries.push(entry);
  saveData(DATA);
  writeDraft = newDraft();
  ROUTE = entry.deliveryDate ? "sealed" : "inbox";
  render();
}

/* =========================================================
   SEALED
========================================================= */
function renderSealed(){
  const frag = el("div");
  frag.appendChild(pageHeader("Sealed", "Letters waiting", "These stay locked until the date you chose. No peeking — that's the whole idea."));

  const list = sealedEntries();
  if(!list.length){
    frag.appendChild(emptyState("●", "Nothing sealed right now", "When you seal a letter for a future date, it'll wait here quietly until that day comes."));
    return frag;
  }
  const listWrap = el("div","letter-list");
  list.forEach(e=>{
    const row = el("div","card letter-row");
    const seal = el("div","seal-mini");
    row.appendChild(seal);
    const meta = el("div","meta");
    const days = daysBetween(todayStr(), e.deliveryDate);
    meta.innerHTML = `<div class="title">${escapeHtml(e.title)}</div><div class="sub">Written ${formatDateShort(e.createdDateStr)} · opens ${formatDate(e.deliveryDate)}</div>`;
    row.appendChild(meta);
    const badge = el("span","badge muted");
    badge.textContent = days<=0 ? "opens today" : `${days} day${days>1?"s":""} left`;
    row.appendChild(badge);
    row.addEventListener("click", ()=>{
      alert(`"${e.title}" is still sealed.\nIt opens on ${formatDate(e.deliveryDate)} — come back then.`);
    });
    listWrap.appendChild(row);
  });
  frag.appendChild(listWrap);
  return frag;
}

/* =========================================================
   INBOX / DELIVERED
========================================================= */
function renderInbox(){
  const frag = el("div");
  frag.appendChild(pageHeader("Delivered", "Your inbox", "Letters that are unlocked and ready — either sealed ones whose date has arrived, or ones you left open."));

  const list = DATA.entries.filter(e => !isSealed(e))
    .sort((a,b)=> e_deliveredDate(b).localeCompare(e_deliveredDate(a)));

  if(!list.length){
    frag.appendChild(emptyState("✉", "Your inbox is empty", "Write a letter and choose to leave it open, or wait for a sealed one to come due."));
    return frag;
  }
  const listWrap = el("div","letter-list");
  list.forEach(e=> listWrap.appendChild(letterRow(e)));
  frag.appendChild(listWrap);
  return frag;
}

function letterRow(e){
  const row = el("div","card letter-row");
  const seal = el("div","seal-mini open");
  seal.textContent = e.opened ? "✓" : "✉";
  row.appendChild(seal);
  const meta = el("div","meta");
  const sourceLabel = e.deliveryDate ? `Sealed ${formatDateShort(e.createdDateStr)}, opened ${formatDateShort(e.deliveryDate)}` : `Written ${formatDateShort(e.createdDateStr)}`;
  meta.innerHTML = `<div class="title">${escapeHtml(e.title)}</div><div class="sub">${sourceLabel}${e.mood ? " · "+e.mood : ""}</div>`;
  row.appendChild(meta);
  if(!e.opened){
    const badge = el("span","badge new"); badge.textContent = "new"; row.appendChild(badge);
  }
  row.addEventListener("click", ()=>{ openModalEntryId = e.id; crackAnimation = !e.opened; render(); });
  return row;
}

/* =========================================================
   ON THIS DAY
========================================================= */
function renderOnThisDay(){
  const frag = el("div");
  frag.appendChild(pageHeader("On this day", "A little time travel", "Every letter resurfaces here on the anniversary of the day you wrote it — a small, unplanned visit from a past version of you."));

  const anns = anniversariesForToday();
  if(!anns.length){
    frag.appendChild(emptyState("☾", "No anniversaries today", "Nothing lines up with today's date yet. Keep writing — this page fills in with time."));
  } else {
    const listWrap = el("div","letter-list");
    anns.forEach(e=>{
      const row = el("div","card letter-row");
      const seal = el("div","seal-mini open"); seal.textContent="☾";
      row.appendChild(seal);
      const meta = el("div","meta");
      meta.innerHTML = `<div class="title">${escapeHtml(e.title)}</div><div class="sub">Written ${formatDate(e.createdDateStr)}</div>`;
      row.appendChild(meta);
      const badge = el("span","badge"); badge.textContent = `${e.yearsAgo} year${e.yearsAgo>1?"s":""} ago`;
      row.appendChild(badge);
      row.addEventListener("click", ()=>{ openModalEntryId = e.id; crackAnimation=false; render(); });
      listWrap.appendChild(row);
    });
    frag.appendChild(listWrap);
  }

  const upcoming = el("div");
  upcoming.style.marginTop = "34px";
  const h = el("h3"); h.style.fontFamily="var(--serif)"; h.style.fontSize="1.05rem"; h.textContent = "Coming up on future anniversaries";
  upcoming.appendChild(h);
  const futureAnns = DATA.entries.filter(e=>!isSealed(e)).map(e=>{
    const md = monthDay(e.createdDateStr);
    let next = yearOf(todayStr())+"-"+md;
    if(next <= todayStr()) next = (yearOf(todayStr())+1)+"-"+md;
    return {e, next, days: daysBetween(todayStr(), next)};
  }).filter(x=>x.days>0 && x.days<=60).sort((a,b)=>a.days-b.days);
  if(!futureAnns.length){
    const p = el("p","page-sub"); p.style.marginBottom="0"; p.textContent = "Nothing due to resurface in the next 60 days.";
    upcoming.appendChild(p);
  } else {
    const listWrap = el("div","letter-list");
    futureAnns.forEach(({e,next,days})=>{
      const row = el("div","card letter-row");
      const seal = el("div","seal-mini open"); seal.textContent="☾";
      row.appendChild(seal);
      const meta = el("div","meta");
      meta.innerHTML = `<div class="title">${escapeHtml(e.title)}</div><div class="sub">Resurfaces ${formatDate(next)}</div>`;
      row.appendChild(meta);
      const badge = el("span","badge muted"); badge.textContent = `in ${days} day${days>1?"s":""}`;
      row.appendChild(badge);
      listWrap.appendChild(row);
    });
    upcoming.appendChild(listWrap);
  }
  frag.appendChild(upcoming);

  return frag;
}

/* =========================================================
   ARCHIVE
========================================================= */
let archiveFilter = { q:"", tag:"", sort:"newest" };
function renderArchive(){
  const frag = el("div");
  frag.appendChild(pageHeader("Archive", "Everything you've written", "Every letter you've ever written, opened or not-yet-sealed, searchable in one place."));

  const toolbar = el("div","toolbar");
  const search = document.createElement("input");
  search.type="text"; search.placeholder="Search titles and letters…"; search.value = archiveFilter.q;
  search.addEventListener("input", e=>{ archiveFilter.q = e.target.value; renderArchiveList(); });
  toolbar.appendChild(search);

  const tagSelect = document.createElement("select");
  const allTags = Array.from(new Set(DATA.entries.flatMap(e=>e.tags||[]))).sort();
  tagSelect.innerHTML = `<option value="">All tags</option>` + allTags.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
  tagSelect.value = archiveFilter.tag;
  tagSelect.addEventListener("change", e=>{ archiveFilter.tag = e.target.value; renderArchiveList(); });
  toolbar.appendChild(tagSelect);

  const sortSelect = document.createElement("select");
  sortSelect.innerHTML = `<option value="newest">Newest first</option><option value="oldest">Oldest first</option>`;
  sortSelect.value = archiveFilter.sort;
  sortSelect.addEventListener("change", e=>{ archiveFilter.sort = e.target.value; renderArchiveList(); });
  toolbar.appendChild(sortSelect);

  frag.appendChild(toolbar);

  const listHolder = el("div"); listHolder.id="archive-list-holder";
  frag.appendChild(listHolder);

  setTimeout(renderArchiveList, 0);
  return frag;

  function renderArchiveList(){
    const holder = document.getElementById("archive-list-holder");
    if(!holder) return;
    holder.innerHTML = "";
    let list = DATA.entries.slice();
    if(archiveFilter.q){
      const q = archiveFilter.q.toLowerCase();
      list = list.filter(e => e.title.toLowerCase().includes(q) || e.body.toLowerCase().includes(q));
    }
    if(archiveFilter.tag){
      list = list.filter(e => (e.tags||[]).includes(archiveFilter.tag));
    }
    list.sort((a,b)=> archiveFilter.sort==="newest" ? b.createdDateStr.localeCompare(a.createdDateStr) : a.createdDateStr.localeCompare(b.createdDateStr));

    if(!list.length){
      holder.appendChild(emptyState("▤", "No letters match", "Try a different search term or clear the tag filter."));
      return;
    }
    const listWrap = el("div","letter-list");
    list.forEach(e=>{
      const row = el("div","card letter-row");
      const seal = el("div","seal-mini" + (isSealed(e) ? "" : " open"));
      seal.textContent = isSealed(e) ? "" : (e.opened ? "✓" : "✉");
      row.appendChild(seal);
      const meta = el("div","meta");
      meta.innerHTML = `<div class="title">${escapeHtml(e.title)}</div><div class="sub">Written ${formatDateShort(e.createdDateStr)}${e.deliveryDate ? " · "+(isSealed(e)?"opens "+formatDateShort(e.deliveryDate):"opened "+formatDateShort(e.deliveryDate)) : ""}${e.mood ? " · "+e.mood:""}</div>`;
      row.appendChild(meta);
      if(isSealed(e)){
        const badge = el("span","badge muted"); badge.textContent = "sealed"; row.appendChild(badge);
      }
      row.addEventListener("click", ()=>{
        if(isSealed(e)){
          alert(`"${e.title}" is still sealed until ${formatDate(e.deliveryDate)}.`);
        } else {
          openModalEntryId = e.id; crackAnimation=false; render();
        }
      });
      listWrap.appendChild(row);
    });
    holder.appendChild(listWrap);
  }
}

/* =========================================================
   SETTINGS
========================================================= */
function renderSettings(){
  const frag = el("div");
  frag.appendChild(pageHeader("Settings", "Your letter box", "Nothing here talks to a server. Every setting and every letter lives only in this browser's storage."));

  const nameField = el("div","card");
  nameField.style.padding = "22px 24px"; nameField.style.marginBottom="18px";
  nameField.innerHTML = `<div class="field" style="margin-bottom:16px;"><label for="s-name">Your name</label></div>`;
  const nameInput = document.createElement("input");
  nameInput.type="text"; nameInput.id="s-name"; nameInput.value = DATA.settings.name || "";
  nameInput.style.cssText = "width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-card);color:var(--ink);";
  nameInput.addEventListener("change", e=>{ DATA.settings.name = e.target.value.trim(); saveData(DATA); });
  nameField.querySelector(".field").appendChild(nameInput);

  const bdayField = el("div","field"); bdayField.style.marginTop="18px"; bdayField.style.marginBottom="0";
  bdayField.innerHTML = `<label for="s-bday">Birthday (used only for the "next birthday" delivery preset)</label>`;
  const bdayInput = document.createElement("input");
  bdayInput.type="date";
  if(DATA.settings.birthday){
    bdayInput.value = "2000-" + DATA.settings.birthday;
  }
  bdayInput.addEventListener("change", e=>{ DATA.settings.birthday = e.target.value ? e.target.value.slice(5) : ""; saveData(DATA); });
  bdayField.appendChild(bdayInput);
  nameField.appendChild(bdayField);
  frag.appendChild(nameField);

  const dataCard = el("div","card");
  dataCard.style.padding = "22px 24px"; dataCard.style.marginBottom="18px";
  dataCard.innerHTML = `<h3 style="font-family:var(--serif);margin:0 0 6px;font-size:1.1rem;">Backup your letters</h3>
    <p style="color:var(--ink-soft);font-size:.88rem;line-height:1.5;margin:0 0 16px;">Since everything lives only in this browser, clearing your browser data or switching devices will lose it unless you keep a backup file. Export regularly.</p>`;
  const dataBtns = el("div"); dataBtns.style.display="flex"; dataBtns.style.gap="10px"; dataBtns.style.flexWrap="wrap";
  const exportBtn = document.createElement("button"); exportBtn.className="btn"; exportBtn.textContent="Export backup (.json)";
  exportBtn.addEventListener("click", exportBackup);
  dataBtns.appendChild(exportBtn);

  const importLabel = document.createElement("label");
  importLabel.className = "btn secondary";
  importLabel.textContent = "Import backup";
  importLabel.style.cursor = "pointer";
  const importInput = document.createElement("input");
  importInput.type="file"; importInput.accept=".json,application/json"; importInput.style.display="none";
  importInput.addEventListener("change", handleImport);
  importLabel.appendChild(importInput);
  dataBtns.appendChild(importLabel);
  dataCard.appendChild(dataBtns);
  frag.appendChild(dataCard);

  const dangerCard = el("div","card");
  dangerCard.style.padding = "22px 24px"; dangerCard.style.borderColor = "var(--wax)";
  dangerCard.innerHTML = `<h3 style="font-family:var(--serif);margin:0 0 6px;font-size:1.1rem;color:var(--wax);">Erase everything</h3>
    <p style="color:var(--ink-soft);font-size:.88rem;line-height:1.5;margin:0 0 16px;">Permanently deletes every letter and setting from this browser. This can't be undone — export a backup first if you're unsure.</p>`;
  const wipeBtn = document.createElement("button"); wipeBtn.className="btn danger"; wipeBtn.textContent="Erase all my data";
  wipeBtn.addEventListener("click", ()=>{
    if(confirm("This will permanently delete every letter in this letter box. This cannot be undone.\n\nHave you exported a backup?")){
      if(confirm("Really erase everything? There is no way back from this.")){
        localStorage.removeItem(STORE_KEY);
        DATA = freshData();
        ROUTE = "write";
        render();
      }
    }
  });
  dangerCard.appendChild(wipeBtn);
  frag.appendChild(dangerCard);

  const about = el("p","page-sub");
  about.style.marginTop = "24px";
  about.innerHTML = `Dear Future Me is free, open source, and offline-first by design — there is no account to create and no data to sell, because there is no server at all.`;
  frag.appendChild(about);

  return frag;
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "dear-future-me-backup-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function handleImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed || !Array.isArray(parsed.entries)){
        alert("That file doesn't look like a Dear Future Me backup.");
        return;
      }
      const mode = confirm("Click OK to MERGE this backup with your current letters, or Cancel to REPLACE everything with the backup.");
      if(mode){
        const existingIds = new Set(DATA.entries.map(x=>x.id));
        parsed.entries.forEach(x=>{ if(!existingIds.has(x.id)) DATA.entries.push(x); });
      } else {
        DATA.entries = parsed.entries;
        if(parsed.settings) DATA.settings = Object.assign({}, DATA.settings, parsed.settings, {onboarded:true});
      }
      saveData(DATA);
      alert("Import complete.");
      render();
    }catch(err){
      alert("Couldn't read that file: " + err.message);
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   SHARED UI PIECES
========================================================= */
function pageHeader(kicker, title, sub){
  const wrap = el("div");
  const k = el("div","page-kicker"); k.textContent = kicker;
  wrap.appendChild(k);
  const h1 = el("h1","page-title"); h1.textContent = title;
  wrap.appendChild(h1);
  const s = el("p","page-sub"); s.textContent = sub;
  wrap.appendChild(s);
  return wrap;
}
function emptyState(glyph, title, sub){
  const wrap = el("div","card empty-state");
  wrap.innerHTML = `<div class="glyph">${glyph}</div><h3>${title}</h3><p>${sub}</p>`;
  const btn = document.createElement("button");
  btn.className="btn"; btn.textContent="Write a letter";
  btn.addEventListener("click", ()=>{ ROUTE="write"; render(); });
  wrap.appendChild(btn);
  return wrap;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* =========================================================
   MODAL (reading a letter)
========================================================= */
function renderModal(entryId){
  const e = DATA.entries.find(x=>x.id===entryId);
  const overlay = el("div","modal-overlay");
  overlay.addEventListener("click", (ev)=>{ if(ev.target===overlay){ closeModal(); } });
  const modal = el("div","modal");

  const closeBtn = document.createElement("button");
  closeBtn.className="modal-close"; closeBtn.textContent="✕"; closeBtn.setAttribute("aria-label","Close");
  closeBtn.addEventListener("click", closeModal);
  modal.appendChild(closeBtn);

  const inner = el("div","modal-inner");

  if(!e){
    inner.innerHTML = "<p>This letter couldn't be found.</p>";
    modal.appendChild(inner);
    overlay.appendChild(modal);
    return overlay;
  }

  if(crackAnimation && !e.opened){
    const envelope = el("div","letter-envelope");
    const seal = el("div","seal-big cracking");
    envelope.appendChild(seal);
    const p = el("p"); p.style.color="var(--ink-soft)"; p.textContent = "Breaking the seal…";
    envelope.appendChild(p);
    inner.appendChild(envelope);
    modal.appendChild(inner);
    overlay.appendChild(modal);

    e.opened = true; e.openedAt = new Date().toISOString();
    saveData(DATA);

    setTimeout(()=>{
      crackAnimation = false;
      render();
    }, 480);
    return overlay;
  }

  if(!e.opened){ e.opened = true; e.openedAt = new Date().toISOString(); saveData(DATA); }

  const doc = el("div","letter-doc");
  const head = el("div","letter-doc-head");
  const dateLine = e.deliveryDate
    ? `Written ${formatDate(e.createdDateStr)} · sealed until ${formatDate(e.deliveryDate)}`
    : `Written ${formatDate(e.createdDateStr)}`;
  head.innerHTML = `<h2 class="letter-doc-title">${escapeHtml(e.title)}</h2><div class="letter-doc-dates">${dateLine}${e.mood ? " · "+e.mood : ""}</div>`;
  if(e.tags && e.tags.length){
    const tagsWrap = el("div","letter-doc-tags");
    e.tags.forEach(t=>{
      const chip = el("span","chip"); chip.textContent = t;
      tagsWrap.appendChild(chip);
    });
    head.appendChild(tagsWrap);
  }
  doc.appendChild(head);
  const body = el("div"); body.textContent = e.body;
  doc.appendChild(body);
  inner.appendChild(doc);

  const actions = el("div","modal-actions");
  const replyBtn = document.createElement("button");
  replyBtn.className="btn"; replyBtn.textContent="Write a reply letter";
  replyBtn.addEventListener("click", ()=>{
    writeDraft = newDraft();
    writeDraft.title = "Re: " + e.title;
    closeModal();
    ROUTE="write"; render();
  });
  actions.appendChild(replyBtn);
  const delBtn = document.createElement("button");
  delBtn.className="btn danger"; delBtn.textContent="Delete this letter";
  delBtn.addEventListener("click", ()=>{
    if(confirm("Delete this letter for good? This can't be undone.")){
      DATA.entries = DATA.entries.filter(x=>x.id!==e.id);
      saveData(DATA);
      closeModal();
      render();
    }
  });
  actions.appendChild(delBtn);
  inner.appendChild(actions);

  modal.appendChild(inner);
  overlay.appendChild(modal);
  return overlay;
}
function closeModal(){ openModalEntryId=null; crackAnimation=false; render(); }

/* =========================================================
   INIT
========================================================= */
DATA.settings.lastSeen = todayStr();
saveData(DATA);
render();

})();
</script>
